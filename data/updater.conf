# Porthole update service settings

[updater]
# Sync the repositories every this many days, 1 or more. Counted from the
# last sync, including ones you ran yourself; never more than once a day,
# to be fair to the Gentoo mirrors.
interval_days = 7

# Check for updates after each sync (the tray tells you when there are
# some). Off: the repositories are only kept up to date.
check_updates = yes

# Don't sync while the laptop runs on battery; it is retried on the next
# hourly run.
skip_on_battery = yes

# Check live (-9999) packages for new upstream commits (with
# smart-live-rebuild, which only asks the remotes) and plan rebuilding
# the ones that changed, after the world update.
live_rebuild = yes

# Live packages never to rebuild this way, as cat/pkg, space separated.
live_exclude =

# List packages nothing needs any more (emerge --depclean), so Updates can
# offer to remove them after an update. Only the ones you tick are removed.
offer_depclean = yes

# How much happens by itself:
#   notify   tell me; nothing is built until I start it
#   approve  I approve updates; they are built in the build window
#   safe     updates with nothing to decide are queued for the build
#            window without asking; the rest waits for me
#   auto     Porthole makes the safe decisions itself (only changes it has
#            checked; never licences, unmasking, compiler switches or
#            removals) and reports each update in News
# Empty: not chosen yet, Porthole asks when it starts.
automation =

# auto: may it accept testing (~arch) versions an update needs?
auto_testing = no

# When approved and automatic updates are built, HH:MM-HH:MM (may wrap past
# midnight, e.g. 23:00-06:00). Needed for approve, safe and auto.
build_window =

# Only start in the build window on mains power.
window_needs_ac = yes

# Only start once nobody has used the computer for this many minutes
# (0: don't wait). A paused build carries on after the same time.
idle_minutes = 15

# Pause a build in the build window while someone uses the computer
# (they can choose Keep building in the job window or the tray).
pause_when_active = yes

# Build at the lowest CPU and disk priority (also updates started by hand).
low_priority = yes
