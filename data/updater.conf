# Porthole update service settings

[updater]
# Days between update checks, 1 or more. The repositories are synced at
# most once a day regardless, to be fair to the Gentoo mirrors.
interval_days = 7

# Sync the repositories (emaint sync --auto) before each check.
sync = yes

# Don't start a check while the laptop runs on battery; it is retried
# on the next hourly run.
skip_on_battery = yes

# Check live (-9999) packages for new upstream commits (with
# smart-live-rebuild, which only asks the remotes) and plan rebuilding
# the ones that changed, after the world update.
live_rebuild = yes

# Live packages never to rebuild this way, as cat/pkg, space separated.
live_exclude =
