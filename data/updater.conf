# Porthole update service settings

[updater]
# Sync the repositories every this many days, 1 or more. Counted from the
# last sync, including ones you ran yourself; never more than once a day,
# to be fair to the Gentoo mirrors.
interval_days = 7

# Check for updates after each sync (the tray tells you when there are
# some). Off: the repositories are only kept up to date.
check_updates = yes

# Don't sync while the laptop runs on battery; it is retried on the next
# hourly run.
skip_on_battery = yes

# Check live (-9999) packages for new upstream commits (with
# smart-live-rebuild, which only asks the remotes) and plan rebuilding
# the ones that changed, after the world update.
live_rebuild = yes

# Live packages never to rebuild this way, as cat/pkg, space separated.
live_exclude =
